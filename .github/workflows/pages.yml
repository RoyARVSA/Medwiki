name: Check and publish Medwiki
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/diagrams/package-lock.json
      - run: npm ci --prefix tools/diagrams --ignore-scripts
      - name: Reject tracked private paths
        shell: bash
        run: |
          if git ls-files | rg '^(private/|00_inbox/|02_sources/raw/|\.obsidian/|\.env($|\.))'; then
            echo 'Private files must not be tracked.'
            exit 1
          fi
      - run: python -m unittest discover -s tests -v
      - run: node tests/learning-functions.test.cjs
      - run: node tests/navigation-functions.test.cjs
      - run: node --check assets/site/site.js && node --check assets/site/learning.js && node --check assets/site/navigation.js
      - run: python scripts/flows.py
      - run: python scripts/build_site.py
      - run: python scripts/lint.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
