<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-flowchart" viewBox="0 0 1032 982" width="1032" height="982" style="--pele-bg:#f8fbff;--pele-fg:#193954;--pele-muted:#536c81;--pele-line:#547da1;--pele-surface:#edf4fb;--pele-surface-alt:#f6f9fd;--pele-border:#8eabc4;--pele-accent:#285f91;max-width:100%;height:auto;--_bg:#f8fbff;--_fg:#193954;--_m:#536c81;--_l:#547da1;--_s:#edf4fb;--_a:#f6f9fd;--_b:#8eabc4;--_c:#285f91;--_r:4px;--_fm:monospace;text-transform:none" fill="#193954" role="img" aria-roledescription="flowchart" aria-labelledby="flow-mdd-canmat-reassessment-title flow-mdd-canmat-reassessment-desc" color="#193954" font-size="18px" font-family="sans-serif" letter-spacing="normal" word-spacing="normal" direction="ltr"><title id="flow-mdd-canmat-reassessment-title">初始抗憂鬱劑反應不足：先再評估，再比較策略</title><desc id="flow-mdd-canmat-reassessment-desc">文字步驟與每個節點的來源列於圖後。先評估安全，再重查診斷與充分治療；優先安全評估，必要時較早考量 ECT；關鍵資訊是否足以比較策略？；明列缺少資料，保留判斷；在耐受與風險下考量最佳化；共同比較換藥、加藥與心理介入；沒有反應或副作用困擾時考量換藥；部分反應且耐受良好時考量加藥；及早評估合適的心理治療；重評結果與後續神經調節選項</desc><g class="pele-edges" fill="none" stroke="#547da1" stroke-linecap="round"><g class="pele-edge" data-id="L_n0_n1_0"><path d="M130.5,78L130.5,410.75" /><path class="pele-marker" d="M130.5,417.75L127.14,409.75L133.86,409.75Z" fill="#547da1" stroke="none" /></g><g class="pele-edge" data-id="L_n0_n2_0"><path d="M245.22,78C245.22,87.28 426.28,89.22 426.28,98.5L426.28,147" /><path class="pele-marker" d="M426.28,154L422.92,146L429.64,146Z" fill="#547da1" stroke="none" /></g><g class="pele-edge" data-id="L_n2_n1_0"><path d="M376.16,310.43C376.16,336.34 224.5,336.34 224.5,362.25L224.5,410.75" /><path class="pele-marker" d="M224.5,417.75L221.14,409.75L227.86,409.75Z" fill="#547da1" stroke="none" /></g><g class="pele-edge" data-id="L_n2_n3_0"><path d="M465.72,317.1L465.72,420.25" /><path class="pele-marker" d="M465.72,427.25L462.36,419.25L469.08,419.25Z" fill="#547da1" stroke="none" /></g><g class="pele-edge" data-id="L_n2_n4_0"><path d="M481.72,307.1C481.72,334.67 7