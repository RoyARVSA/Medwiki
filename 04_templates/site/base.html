<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="medwiki-generated" content="true">
  <meta name="color-scheme" content="light">
  <meta name="description" content="{% block description %}醫學學習、文獻閱讀與持續累積的知識筆記。{% endblock %}">
  <title>{% block title %}Medwiki · 醫學學習知識庫{% endblock %}</title>
  <link rel="icon" href="{{ asset('assets/images/medwiki-mark.svg', current) }}" type="image/svg+xml">
  <link rel="icon" href="{{ asset('assets/images/favicon-32.png', current) }}" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="{{ asset('assets/site/site.css', current) }}">
  <link rel="stylesheet" href="{{ asset('assets/site/learning.css', current) }}">
  {% block extra_head %}{% endblock %}
  <script src="{{ asset('assets/site/site.js', current) }}" defer></script>
  <script src="{{ asset('assets/site/learning.js', current) }}" defer></script>
</head>
<body data-home="{{ rel('index.html', current) }}" class="{% block bodyclass %}{% endblock %}">
  <a class="skip" href="#main">跳至正文</a>
  <header class="site-header">
    <a class="brand" href="{{ rel('index.html', current) }}" aria-label="Medwiki 首頁"><img class="brand-icon" src="{{ rel('assets/images/medwiki-mark.svg', current) }}" alt="" width="44" height="44"><span>medwiki<span class="brand-caption">MEDICAL LEARNING</span></span></a>
    <nav class="global-nav" aria-label="全站導航">
      <a href="{{ rel('index.html', current) }}#specialties">科別</a>
      <a href="{{ rel('index.html', current) }}#concepts">疾病與概念</a>
      <a href="{{ rel('index.html', current) }}#reasoning">臨床思路</a>
      <a href="{{ rel('index.html', current) }}#outputs">學習成果</a>
    </nav>
    <button class="search-trigger" data-open-search aria-label="搜尋知識庫"><span aria-hidden="true">⌕</span><span class="search-word">搜尋知識庫</span><kbd>⌘ / Ctrl K</kbd></button>
  </header>
  {% block body %}{% endblock %}
  <footer class="site-footer"><a href="{{ rel('index.html', current) }}">medwiki</a><span>醫學學習知識網站</span><span>學習筆記 · 檢視各頁審閱狀態 · 不取代個案判斷</span></footer>
  <!-- SEARCH_DATA -->
  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
    <div class="dialog-top"><span class="eyebrow" id="search-title">SEARCH THE LIBRARY</span><button data-close-dialog aria-label="關閉搜尋">✕</button></div>
    <label class="sr-only" for="search-input">搜尋主題、英文術語或縮寫</label>
    <input id="search-input" type="search" placeholder="搜尋主題、英文術語或縮寫…" autocomplete="off">
    <div class="search-filters"><label>內容 <select id="search-type"><option value="">全部</option><option value="concept">疾病與概念</option><option value="comparison">鑑別與證據比較</option><option value="approach">臨床思路與準則</option><option value="source_summary">文獻與學習資源</option><option value="map">學習導航</option></select></label><span>搜尋已公開內容</span></div>
    <div id="search-results" aria-live="polite"><p class="muted">輸入關鍵字開始搜尋。</p></div>
  </dialog>
  <dialog id="citation-dialog" class="citation-dialog" aria-labelledby="citation-title">
    <div class="dialog-top"><span class="eyebrow">REFERENCE / LOCATOR</span><button data-close-dialog aria-label="關閉引用">✕</button></div>
    <h2 id="citation-title"></h2><p id="citation-locator"></p><p id="citation-full" class="muted"></p><a id="citation-doi" target="_blank" rel="noopener">前往原文 DOI ↗</a>
  </dialog>
</body>
</html>
