<section class="concept-directory" aria-label="疾病與概念目錄"><div class="directory-heading"><p>目前 {{library.concepts|length}} 個共同核心頁。可用全站搜尋查找別名、徵象或內文。</p><button class="button primary" data-open-search>搜尋疾病與概念 ⌕</button></div><div class="concept-grid">{% for p in library.concepts %}<a class="concept-card" href="{{rel(p.url,current)}}"><span class="eyebrow">{{ '檢查徵象' if p.content_kind=='sign' else '疾病與概念' }}</span><h2>{{p.title}}</h2><p class="concept-english">{{p.title_en}}</p><p>{{p.summary}}</p><span>閱讀正文 ↗</span></a>{% endfor %}</div></section>
