  - {from: eye-intensive, to: eye, role: feedback, label: 治療中反覆檢視眼表與感染，惡化即重選處理}
  - {from: eye-intensive, to: recovery, label: 急性病灶改善後仍追眼表炎症}
  - {from: organs, to: recovery, label: 急性支持與觀察持續到相應問題恢復}
  - {from: infection, to: recovery, label: 感染與器官狀態持續追蹤}
