notes:
  - '眼、全身器官與感染可同時需要處理；合流表示共同重評任務，不要求等其他工作線完成。[@W:4-6]'
  - 'CQ10十例系列的滴眼、眼膏與減量時程見同頁表格；固定追蹤間隔及完整處方安全資訊的缺口集中說明。[@W:5-6]'
