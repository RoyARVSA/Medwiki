id: mdd-mania-safety
title: 轉躁線索：先核對病程，再依情境轉入專業照護
kind: management
presentation: clinical-cards
population: 成人 MDD 再評估中需核對轉躁線索、疑似雙極性或已出現躁／輕躁的學習情境。
version: NIMH 2025 症狀／診斷段；NICE CG185（2025-09-02 更新）辨認／評估及躁期選讀；CANMAT 2023 update。
source_ids:
- src-nimh-bipolar-page
- src-nice-cg185-selected
- src-canmat-2023-update
review_status: not_reviewed
conflict_status: none
entry: context
nodes:
- id: context
  kind: step
  role: assessment
  card_width: 600
  label: 記錄轉躁線索、縱向病程與實際用藥
  items:
  - 詢問睡眠需求降低、活動增加、語速加快／思緒奔逸及異常誇大。
  - 補持續時間、嚴重度、功能、旁證、過往病程及物質／藥物因素。
  - 列出抗憂鬱劑、抗精神病藥與 mood stabiliser，區分單方與合併用藥。
  detail: 結合持續時間、嚴重度、功能與縱向病程，安排精神科診斷及鑑別；有危險或疑似躁症時優先評估。
  citations:
  - '[@NIMH:symptoms]'
  - '[@NIMH:diagnosis]'
  - '[@NB:recognition]'
  - '[@NB:assessment]'
- id: specialist
  kind: terminal
  role: safety
  card_width: 640
  label: 轉入專業照護：緊急評估與用藥前提分開
  items:
  - 疑似躁症、嚴重憂鬱或對自己／他人有危險：依 NICE 1.2.2 緊急專業評估。
  - 僅有辨認線索：取得完整病程與精神科鑑別評估。
  - 僅在已出現躁／輕躁且抗憂鬱劑單方時，1.5.2 建議考量停該藥，並提供抗精神病藥，不論是否停抗憂鬱劑。
  - 已出現躁／輕躁，且尚未使用抗精神病藥或 mood stabiliser，1.5.3 列 haloperidol、olanzapine、quetiapine、risperidone；保留偏好、共病、過往反應與副作用。
  detail: 依確認後的躁／輕躁狀態與實際用藥，比較適用方案；選擇時納入偏好、共病、既往反應與副作用。
  citations:
  - '[@NB:recognition]'
  - '[@NB:assessment]'
  - '[@NB:mania]'
  - '[@C:11,36-37]'
- id: complete
  kind: terminal
  role: outcome
  card_width: 460
  label: 未見所列線索，保留病程與鑑別追蹤
  items:
  - 帶回縱向病程、實際用藥與反應，比較適用的MDD策略。
  - 後續出現新線索或安全改變時，重新評估。
  detail: 繼續追蹤病程與功能變化。
  citations:
  - '[@NIMH:diagnosis]'
  - '[@NB:assessment]'
  - '[@C:33-34]'
- id: missing
  kind: unknown
  role: uncertainty
  card_width: 480
  label: 尚無已知風險／線索，但病程資料仍缺
  items:
  - 補持續時間、病程、旁證、功能及實際用藥。
  - 安全資料不清時先做臨床安全評估；已有危險或疑似躁症時緊急轉介。
  detail: 取得病程與用藥資料後重新評估。
  citations:
  - '[@NB:recognition]'
  - '[@NB:assessment]'
  - '[@C:11]'
edges:
- from: context
  to: specialist
  label: 有線索／風險、疑似或已確認躁／輕躁
  role: flow
- from: context
  to: complete
  label: 已核對，未見上述線索或風險
  role: flow
- from: context
  to: missing
  label: 尚無已知線索／風險，但資料未齊
  role: flow
- from: missing
  to: context
  label: 補病程與用藥後回查；安全疑慮先處理
  role: feedback
notes: []
