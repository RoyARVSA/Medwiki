id: japanese-sjs-criteria
title: SJS/TEN：辨識、診斷與嚴重度分層
kind: management
presentation: clinical-cards
population: 疑似或已診斷SJS/TEN的學習路徑；診斷使用日本2025準則，國際面積分類分開標示。
version: Watanabe 2025 Supplement（2026刊登），Table3、CQ6、9–16；Heuer 2026引言。
source_ids: [src-watanabe-2026, src-heuer-2026]
review_status: not_reviewed
conflict_status: open
entry: suspect
nodes:
  - id: suspect
    kind: step
    role: safety
    card_width: 560
    label: 疑似SJS/TEN：撤藥、支持照護與眼部評估同時開始
    detail: 廣泛紅斑、水疱／糜爛及黏膜損傷時及早辨識，撤除可能致病藥物並開始支持照護；診斷資料回補與照護並行。
    items:
      - 核對用藥及開始／停用時間，撤除可能致病藥物。
      - 開始支持照護；同步查看眼表上皮缺損、偽膜與全身器官狀態。
      - 眼部嚴重或病情快速惡化時，立即接圖2全身治療及圖3眼部處理。
    citations: ['[@H:1-2]', '[@W:5-7]']
  - id: collect
    kind: step
    role: assessment
    card_width: 560
    label: 取得全病程皮膚、黏膜、病理及鑑別資料
    detail: 次要準則、嚴重度／倦怠、治療反應與病理共同參與EMM鑑別。將每項原始依據保留為符合、不符或未確認。
    items:
      - 記錄全身分布、各時點面積，計入輕壓易剝離區；查看眼、口腔及生殖器。
      - 取得發燒病史／體溫、病理報告、用藥與治療反應。
      - 鑑別EMM、自體免疫水疱病與抗癌藥直接藥理性傷害。
    citations: ['[@W:9-11]']
  - id: checklist
    kind: step
    role: criteria
    card_width: 720
    label: 日本SJS：全部五項主準則＋次要資訊與完整病程
    detail: 五項一起核對。次要資訊包括臉頸軀幹平坦非典型靶形、雙側急性結膜炎合併偽膜／上皮缺損、倦怠與進食困難及排除自體免疫水疱病；詳細病理註記與例外見同頁準則表。
    items:
      - ① 黏膜皮膚交界廣泛、嚴重病灶，例如出血性糜爛或結痂。
      - ② 廣泛紅斑＋表皮壞死性糜爛／水疱；恢復後結痂／膜狀脫屑；受影響區<10% BSA，含輕壓易剝離區。
      - ③ 存在發燒。
      - ④ 組織病理顯示表皮壞死。
      - ⑤ 排除EMM及細胞毒性抗癌藥直接藥理作用、而非遲發型過敏所致皮膚傷害。
    citations: ['[@W:9]', '[@W:11]']
  - id: classify
    kind: step
    role: assessment
    card_width: 480
    label: 面積≥10%：核對TEN準則並註明分類版本
    detail: 日本TEN須三項全滿足，並考慮次要資訊及全病程。指定排除包括AGEP、自體免疫水疱病、SSSS、TSS、impetigo及抗癌藥藥理性傷害。
    items:
      - 日本TEN：>10% BSA（含易剝離區）＋發燒＋排除指定疾病。
      - 國際：10–30%為overlap；>30%為TEN。
      - 恰10%的日本準則界線保留待釐清，繼續按臨床狀態照護。
    citations: ['[@W:10]', '[@H:1]']
  - id: clarify
    kind: step
    role: uncertainty
    card_width: 480
    label: 回補病理／缺項，重查EMM與藥理性傷害
    detail: 未取得病理維持未確認；已知不符與未知可以並存。持續疑似時，撤藥、支持及眼部照護繼續進行。
    items:
      - 取得缺少的病理、發燒及全身範圍記錄。
      - 綜合分布、黏膜嚴重度、反應及病理，重查EMM與藥物機轉。
      - 資料回填清單；仍疑似者同時進入嚴重度與器官分層。
    citations: ['[@W:9-11]', '[@H:1-2]']
  - id: alternative
    kind: terminal
    role: action
    card_width: 440
    label: 支持其他病因：轉相應疾病／藥物傷害處理
    detail: 抗癌藥暴露本身不足以判定直接毒性；此出口需有臨床與機轉依據。
    items:
      - 直接藥理性傷害可考慮局部類固醇、口服抗組織胺等支持療法。
      - 該情境使用高劑量全身類固醇／免疫抑制須審慎。
    citations: ['[@W:11]']
  - id: severity
    kind: step
    role: assessment
    card_width: 640
    label: 以進展速度、眼表與全身器官決定當下照護
    detail: Figure2依臨床進展與嚴重度選初始治療；CRISTEN十項詳細定義在同頁表格，作預後資料，來源沒有其治療切點。
    items:
      - 分清慢進展輕中度、進展性／嚴重、快速進展／最嚴重。
      - 眼表上皮缺損或偽膜＝嚴重眼部侵犯；皮膚輕也可考慮早期pulse。
      - 同步核對呼吸支持需求、肝腎異常、感染／sepsis及CRISTEN病史因子。
    citations: ['[@W:4-8]']
  - id: next-tasks
    kind: terminal
    role: action
    card_width: 560
    label: 接續同頁圖2治療選擇，並行圖3器官照護
    detail: 兩項任務並行，診斷與面積分類的變化持續回填。
    items:
      - 圖2：選0.5–1 mg/kg/day、1 mg/kg/day或pulse，依反應接PE／IVIG等升階。
      - 圖3：嚴重眼部局部治療與感染監測；呼吸／肝腎支持及後遺症追蹤。
    citations: ['[@W:5-7]', '[@W:11]']
edges:
  - {from: suspect, to: collect, label: 診斷查核與照護並行}
  - {from: suspect, to: severity, role: option, label: 眼部嚴重／快速惡化，照護立即前進}
  - {from: collect, to: checklist, label: 一次核對五項}
  - {from: checklist, to: severity, label: 全部五項符合，依日本準則診斷SJS}
  - {from: checklist, to: classify, label: 受影響面積≥10% BSA}
  - {from: checklist, to: clarify, label: 其他缺項／不符或鑑別未明}
  - {from: classify, to: severity, label: 仍支持SJS/TEN，照護按實際進展與器官狀態}
  - {from: classify, to: clarify, label: 發燒／指定鑑別未齊或不符，回補並重查}
  - {from: clarify, to: checklist, role: feedback, label: 新資料／病程取得後重核五項}
  - {from: clarify, to: severity, label: 仍疑似SJS/TEN，持續分層照護}
  - {from: clarify, to: alternative, label: 判讀支持其他疾病／直接藥理性傷害}
  - {from: severity, to: next-tasks, label: 治療與器官工作包同步執行}
notes:
  - '本圖將撤藥、診斷回補與照護連接為閱讀路徑；支持照護操作細節的來源缺口集中列在同頁。[@H:1-2]'
  - '日本SJS的<10%與TEN的>10%保留原文；國際10–30% overlap另列。[@W:9-10][@H:1]'
