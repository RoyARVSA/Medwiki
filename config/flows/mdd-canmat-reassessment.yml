  to: safety
  label: 已知高風險／嚴重情境，優先照護
  role: flow
- from: reassess
  to: history
  label: 安全已評估，可同步進行再評估
  role: flow
- from: reassess
  to: missing
  label: 安全資訊尚未確認，先補安全評估
  role: flow
- from: history
  to: bipolar
  label: 有轉躁線索或疑似雙極性
  role: flow
- from: history
  to: exposure
  label: 已核對，可繼續比較 MDD 治療
  role: flow
- from: history
  to: missing
  label: 病程／轉躁資訊尚缺
  role: flow
- from: exposure
  to: measurement
  label: 同時對照實際治療與結果
  role: flow
- from: missing
  to: reassess
  label: 補對應資料後回查；安全疑慮立即重評
  role: feedback
- from: measurement
  to: ready
  label: 已知治療暴露、反應與耐受，可比較策略
  role: flow
- from: measurement
  to: missing
  label: 仍缺劑量、日期、反應或耐受資料
  role: flow
notes:
- 病史、實際治療及症狀測量可並行收集。[@C:7-8,11,33-35]
