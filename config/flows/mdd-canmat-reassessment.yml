id: mdd-canmat-reassessment
title: 反應不足的第一步：安全、病程、實際用藥與症狀變化
kind: management
presentation: clinical-cards
population: 成人 MDD 初始抗憂鬱劑反應不理想；先確認仍適用單極性憂鬱症的治療情境。
version: CANMAT 2023 update（2024 出版），Q1／Q2／Q5／Q7；轉躁線索另參照 NIMH 2025 與 NICE CG185 選讀。
source_ids:
- src-canmat-2023-update
- src-nimh-bipolar-page
- src-nice-cg185-selected
review_status: not_reviewed
conflict_status: none
entry: reassess
nodes:
- id: reassess
  kind: decision
  role: safety
  card_width: 600
  label: 現在是否需要優先安全處置？
  items:
  - 詢問自殺意念、計畫與意圖，並核對可用支持與保護因素。
  - 檢視精神病性／catatonic 表現、身體惡化及照護場域。
  - 已有風險或安全資訊不清時，先做臨床安全評估；其餘資料同步補齊。
  detail: 結合自殺意念、計畫、意圖、保護因素、精神病性或catatonic表現與身體狀況，安排安全計畫及照護場域。
  citations:
  - '[@C:11,14,28,41]'
- id: safety
  kind: terminal
  role: safety
  card_width: 520
  label: 安排安全計畫與合適照護場域
  items:
  - 高風險者依個別情境安排住院、支持與環境安全。
  - 嚴重自殺風險、精神病性／catatonic表現或身體惡化：可較早考量ECT。
  - 既往ECT反應良好者，也可較早比較ECT。
  detail: 共同評估ECT的適用情境、效益與負擔，安排後續照護。
  citations:
  - '[@C:11,14,41]'
- id: history
  kind: decision
  role: assessment
  card_width: 620
  label: 重查病程：有沒有轉躁線索或其他影響因素？
  items:
  - 核對縱向病程、既往治療反應、家族史，必要時取得家屬／照顧者旁證。
  - 詢問睡眠需求降低、活動增加、語速加快／思緒奔逸及異常誇大。
  - 同時查精神科與身體共病、物質／藥物因素、壓力及睡眠呼吸中止等線索。
  - 病史與身體檢查引導驗證；CBC／TSH 可協助查貧血與甲狀腺問題。
  detail: 依病程、身體檢查及共病線索選擇檢驗；進一步核對躁／輕躁症狀的持續時間、功能與物質／藥物因素。
  citations:
  - '[@C:7-8,33-34]'
  - '[@NIMH:symptoms]'
  - '[@NIMH:diagnosis]'
  - '[@NB:assessment]'
- id: bipolar
  kind: terminal
  role: safety
  card_width: 520
  label: 轉入雙極性評估，先釐清治療情境
  items:
  - 疑似躁症、嚴重憂鬱或對自己／他人有危險：緊急專業評估。
  - 其餘轉躁線索：核對持續時間、病程、嚴重度、功能及物質／藥物因素。
  - 本頁第三張圖列出評估與用藥情境。
  detail: 依NICE CG185安排辨認、轉介與完整精神科評估；按確認後的診斷情境選擇治療。
  citations:
  - '[@NB:recognition]'
  - '[@NB:assessment]'
  - '[@NIMH:diagnosis]'
- id: exposure
  kind: step
  role: assessment
  card_width: 600
  label: 對照處方與實際服用，重建治療暴露
  items:
  - 記錄藥名、製劑、處方劑量與實際服用劑量。
  - 列出開始與調量日期，查明中斷、漏服或自行減量的原因。
  - 核對不良反應、共用藥與殘餘症狀。
  detail: 逐次對照實際服用的劑量、時間與療效；資料不清時補處方及服用紀錄。
  citations:
  - '[@C:16,33-35]'
- id: measurement
  kind: step
  role: assessment
  card_width: 620
  label: 用同一量表、基準與日期量化變化
  items:
  - 用同一工具記錄基準、追蹤分數與日期，並評估功能及不良反應。
  - 早期改善：開始治療後2–4週較基準改善≥20%；response：改善≥50%。
  - 第4週改善<20%：考量增量；有耐受問題時考量換藥。
  detail: 量表與臨床訪談一起判讀，另記個別殘餘症狀。無可比較基準或日期時，補齊後再比較變化。
  citations:
  - '[@C:28-30,35]'
- id: missing
  kind: unknown
  role: uncertainty
  card_width: 560
  label: 指出缺哪項資料，回到對應核對
  items:
  - 安全狀態不清：先進行臨床安全評估，不等待一般用藥資料齊備。
  - 病程不清：補訪談與適當旁證；劑量／日期不清：對照處方與實際服用。
  - 缺可比較量表：補記工具、分數、日期，同時保留臨床與功能評估。
  detail: 補齊影響診斷或療效判讀的資料；已有安全疑慮先處理，再回查其餘項目。
  citations:
  - '[@C:7-8,11,28-30,33-35]'
  - '[@NB:assessment]'
- id: ready
  kind: terminal
  role: outcome
  card_width: 520
  label: 帶著反應、耐受與偏好，進入策略比較
  items:
  - 低劑量／部分改善且耐受良好：核對能否合理增量。
  - 無反應或副作用困擾：換藥較有優先考量。
  - 部分反應且耐受良好：加藥可較早考量；心理治療可並行。
  detail: 依反應、耐受、既往效果、患者偏好與可近性，比較本頁第二張圖的策略。
  citations:
  - '[@C:34-36]'
edges:
