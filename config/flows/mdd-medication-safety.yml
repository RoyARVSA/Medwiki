id: mdd-medication-safety
title: duloxetine：逐藥核對腎肝限制與其他安全條件
kind: management
presentation: clinical-cards
population: 現用或候選藥含duloxetine的成人MDD。
version: CYMBALTA 美國標示 08/2023 §§2.7–2.9 選讀；換藥差異另對照 CANMAT 2023 update。
source_ids:
- src-cymbalta-us-label-2023
- src-canmat-2023-update
review_status: not_reviewed
conflict_status: open
entry: context
nodes:
- id: context
  kind: step
  role: assessment
  card_width: 520
  label: 候選藥含 duloxetine 時，核對製劑與腎肝資料
  items:
  - 確認藥名／製劑、實際服用與共用藥。
  - 取得腎功能指標與單位、慢性肝病／肝硬化病史。
  detail: 對照本版美國標示的腎肝條件；同時核對其他警語、交互作用與當地標示。
  citations:
  - '[@DUL:4]'
  - '[@C:11]'
- id: duloxetine-check
  kind: decision
  role: decision
  card_width: 560
  label: 有沒有 §2.7 任一避免使用條件？
  items:
  - GFR <30 mL/minute。
  - 慢性肝病或肝硬化。
  detail: 上述任一條件符合即依該標示避免使用；補查其他尚未取得的腎肝資料。
  citations:
  - '[@DUL:4]'
- id: avoid
  kind: terminal
  role: safety
  card_width: 500
  label: 任一符合：依該美國標示避免 duloxetine
  items:
  - GFR <30 mL/minute，或慢性肝病／肝硬化，任一符合即適用。
  - 保留其他未知資料，帶著腎肝與共用藥資料返回候選藥比較。
  detail: 依腎肝狀況比較替代候選藥；已在服用者評估調整方式，標示§2.8建議可能時逐步減量。
  citations:
  - '[@DUL:4]'
- id: complete
  kind: terminal
  role: outcome
  card_width: 520
  label: 繼續核對其他警語、交互作用與適應症
  items:
  - 已核對GFR ≥30 mL/minute，且無上述肝病條件。
  - 續查其他警語、交互作用與當地標示。
  - duloxetine→MAOI的washout差異見本頁並列說明。
  detail: CANMAT一般表述與duloxetine個別標示的時間窗分開列出，差異維持open。
  citations:
  - '[@DUL:4]'
  - '[@C:35]'
- id: missing
  kind: unknown
  role: uncertainty
  card_width: 480
  label: 尚無已知限制，但仍缺資料：補齊再核對
  items:
  - 補腎功能指標、單位及肝病評估。
  - 已有任一限制成立時先依該限制處理。
  detail: 資料取得後回查相應條件。
  citations:
  - '[@DUL:4]'
edges:
- from: context
  to: duloxetine-check
  label: 對照原標示的兩項限制
  role: flow
- from: duloxetine-check
  to: avoid
  label: 至少一項已符合，保留其他未知
  role: flow
- from: duloxetine-check
  to: complete
  label: 兩項均已核對且未符合
  role: flow
- from: duloxetine-check
  to: missing
  label: 無已知符合，但至少一項未確認
  role: flow
- from: missing
  to: context
  label: 補對應腎肝資料後回查
  role: feedback
notes:
- CYMBALTA美國標示08/2023：腎功能條件使用GFR，單位為mL/minute。[@DUL:4]
